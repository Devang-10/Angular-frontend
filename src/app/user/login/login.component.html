<body class="d-flex align-items-center justify-content-center">
  <div
    class="card login-card w-50 p-5 shadow d-flex justify-content-center align-items-center border-1"
  >
    <h2 class="text-center fw-bold mb-1">Sign-in</h2>
    <hr class="text-muted mb-4 w-50" />

    <form>
      <div class="mb-4 w-100">
        <input
          type="email"
          name="email"
          class="form-control custom-input border-0 border-bottom border-secondary no-focus-glow"
          id="email"
          placeholder="Email"
          autocomplete="off"
          required
          [(ngModel)]="email"
        />
      </div>

      <div *ngIf="email && !email.includes('@')">
        Please enter a valid email!
      </div>

      <div class="mb-3 w-100">
        <input
          type="password"
          name="password"
          class="form-control custom-input border-0 border-bottom border-secondary no-focus-glow"
          id="password"
          placeholder="Password"
          required
          autocomplete="off"
          minlength="8"
          [(ngModel)]="password"
        />
      </div>

      <div class="text-start mb-4">
        <a
          type="button"
          class="text-decoration-none small fw-semibold"
          (click)="forgotPassword()"
          >Forgot Password?</a
        >
      </div>

      <div class="d-grid mb-4">
        <button
          type="submit"
          id="login-btn"
          class="btn btn-all py-2 fs-5 btn-green"
          (click)="login()"
          [disabled]="!isFormValid()"
        >
          Login
        </button>
      </div>

      <div class="text-center small text-muted fw-semibold">
        Don't have an Account?
        <a routerLink="/signup" class="text-decoration-none fw-semibold"
          >Create an account</a
        >
      </div>
    </form>
  </div>
</body>
