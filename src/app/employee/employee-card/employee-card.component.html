<div #cardRoot class="card shadow-sm h-100">
  <div class="card-body text-center">
    <h5 class="card-title">{{ employee.name }}</h5>

    <p class="mb-1"><strong>Department:</strong> {{ employee.department }}</p>

    <div class="d-flex justify-content-center gap-2 actions">

      <button class="btn btn-danger btn-sm" (click)="onDelete()">Delete</button>
      <button class="btn btn-primary" (click)="viewDetails(employee.id)">
        View Details
      </button>
    </div>
  </div>
</div>
