<div class="container mt-4">
  <div class="card shadow p-4">
    <h3 class="mb-4 text-center">Edit Employee</h3>

    <form #empForm="ngForm" (ngSubmit)="saveEmployee()">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input
          type="text"
          class="form-control"
          name="name"
          [(ngModel)]="employee.name"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Department</label>
        <input
          type="text"
          class="form-control"
          name="department"
          [(ngModel)]="employee.department"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label">City</label>
        <input
          type="text"
          class="form-control"
          name="city"
          [(ngModel)]="employee.city"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Age</label>
        <input
          type="number"
          class="form-control"
          name="age"
          [(ngModel)]="employee.age"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Salary</label>
        <input
          type="number"
          class="form-control"
          name="salary"
          [(ngModel)]="employee.salary"
          required
        />
      </div>

      <div class="d-flex gap-2">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="empForm.invalid"
        >
          Save
        </button>

        <button type="button" class="btn btn-secondary" routerLink="/employees">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
